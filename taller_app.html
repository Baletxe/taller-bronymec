<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E2A3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fabricación">
<title>Fabricación Bronymec</title>
<style>
@font-face{font-family:Archivo;src:url(archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{
  --board:#DCE2E6; --board-dot:#C6CFD5; --paper:#FFFFFF; --paper-2:#F3F6F8; --ink:#12222E; --ink-2:#44576A; --ink-3:#6A7B88;
  --line:#CBD4DA; --navy:#0E2A3D; --brand:#014A7D;
  --late:#C8322B; --late-t:#FBE6E4; --soon:#D58B12; --soon-t:#FCF0D9; --ok:#2E7D4F; --ok-t:#E2F2E8; --done:#8A99A4;
  --m1:#1F6FAE; --m2:#1E9E8F; --m3:#B5651D; --m4:#7A4FB5; --m5:#4F6475; --m6:#A23B72;
  --r:10px; --sh:0 1px 0 rgba(14,42,61,.06),0 6px 14px -8px rgba(14,42,61,.28);
  color-scheme:light;
}
:root[data-theme=dark]{
  --board:#0D161D; --board-dot:#1A2833; --paper:#16232D; --paper-2:#1B2A35; --ink:#E6EEF3; --ink-2:#AFC0CC; --ink-3:#8496A3;
  --line:#2A3B47; --navy:#081822; --brand:#7CB8E4;
  --late:#F06A62; --late-t:#3A1E1E; --soon:#F0B14A; --soon-t:#3A2E17; --ok:#5CC48A; --ok-t:#16322A; --done:#6E808C;
  --m1:#4A97D8; --m2:#33B8A6; --m3:#D88A45; --m4:#A884DD; --m5:#8FA4B5; --m6:#D97AAE;
  --sh:0 1px 0 rgba(0,0,0,.3),0 8px 18px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --board:#0D161D; --board-dot:#1A2833; --paper:#16232D; --paper-2:#1B2A35; --ink:#E6EEF3; --ink-2:#AFC0CC; --ink-3:#8496A3;
  --line:#2A3B47; --navy:#081822; --brand:#7CB8E4;
  --late:#F06A62; --late-t:#3A1E1E; --soon:#F0B14A; --soon-t:#3A2E17; --ok:#5CC48A; --ok-t:#16322A; --done:#6E808C;
  --m1:#4A97D8; --m2:#33B8A6; --m3:#D88A45; --m4:#A884DD; --m5:#8FA4B5; --m6:#D97AAE;
  --sh:0 1px 0 rgba(0,0,0,.3),0 8px 18px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variation-settings:"wdth" 100;color:var(--ink);background:var(--board);
  background-image:radial-gradient(var(--board-dot) 1px,transparent 1.2px);background-size:22px 22px;min-height:100vh;-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.cond{font-variation-settings:"wdth" 82}

/* ---------- barra ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 18px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.top .brand{flex:none}.top .brand b{white-space:nowrap}
.top .brk{flex-basis:100%;height:0;order:3}
.top .nav{order:4;margin-left:0}
.top .ctx.sec{order:5;margin-left:auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.bm{width:40px;height:40px;border-radius:10px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.02em;flex:none}
.brand b{font-size:19px;font-weight:750;letter-spacing:-.01em;font-variation-settings:"wdth" 110}
.brand span{display:block;font-size:12.5px;color:#A9C2D4;margin-top:-2px}
.nav{display:flex;gap:4px;margin-left:12px;background:rgba(255,255,255,.07);padding:4px;border-radius:12px}
.nav button{height:42px;padding:0 16px;border-radius:9px;font-weight:650;color:#C9DAE6;font-size:15px;display:flex;align-items:center;gap:8px}
.nav button[aria-current]{background:#fff;color:var(--navy)}
.nav:empty{display:none}
.nav .c{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--late);color:#fff;font-size:12px;display:grid;place-items:center}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.srch{display:flex;align-items:center;gap:8px;height:42px;border-radius:10px;background:rgba(255,255,255,.1);padding:0 12px;width:250px}
.srch input{background:none;border:0;outline:0;color:#fff;width:100%;font-size:15px}
.srch input::placeholder{color:#93AFC3}
.srch svg,.ib svg{width:19px;height:19px;flex:none}
.top .nsrch{order:4;flex:1 1 300px;display:none;min-width:0}
body.v-art .top .nsrch{display:flex}
.nsrch .srch{display:flex!important;width:100%;height:50px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:0 16px;gap:10px}
.nsrch .srch:focus-within{background:#fff;border-color:#fff;box-shadow:0 0 0 4px rgba(46,139,216,.45)}
.nsrch .srch:focus-within input{color:var(--navy)}.nsrch .srch:focus-within svg{color:var(--navy)}
.nsrch .srch input{font-size:17px;font-weight:600}
.nsrch .srch svg{width:22px;height:22px}
/* v18 · mensajes */
.dock button{position:relative}.dock .dc{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--late);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center}
.msg-alert{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 12px;padding:14px 18px;border-radius:14px;background:var(--late);color:#fff;text-align:left;box-shadow:0 12px 24px -14px var(--late);animation:mpulse 2.4s ease-in-out infinite}
.msg-alert svg{width:26px;height:26px;flex:none}.msg-alert span{flex:1;font-size:16px}.msg-alert b{font-weight:850}.msg-alert em{font-style:normal;font-weight:850;background:rgba(255,255,255,.2);padding:6px 14px;border-radius:999px}
@keyframes mpulse{50%{box-shadow:0 12px 30px -8px var(--late)}}
@media (prefers-reduced-motion:reduce){.msg-alert{animation:none}}
.pq-door .dk .mp{display:inline-block;margin-top:3px;font-weight:800;color:#fff;background:rgba(255,60,60,.85);border-radius:6px;padding:1px 7px}.pq-door.total .dk .mp{color:#fff}
.vh .seg button{white-space:nowrap;padding:0 13px}
@media (max-width:560px){.vh .seg{width:100%;display:flex}.vh .seg button{flex:1;padding:0 6px;font-size:13px}}
.gch{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:800;color:#fff;background:var(--gc);white-space:nowrap}
.msgw{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:14px;height:calc(100dvh - var(--toph,64px) - 150px);min-height:460px}
.ml{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.ml .mnew{justify-content:center;height:48px;font-size:15.5px;gap:8px;flex:none}.ml .mnew svg{width:20px;height:20px}
.mli{display:flex;flex-direction:column;gap:6px;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper)}
.mli:hover{background:var(--paper-2)}.mli.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.mli-h{display:flex;align-items:center;gap:6px}.mli-h i{font-style:normal;color:var(--ink-3)}.mli-h .sp{flex:1}.mli-h small{color:var(--ink-3);font-size:12px;white-space:nowrap}
.mli-t{font-size:14px;color:var(--ink-2);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.mli-t em{font-style:normal;font-weight:750;color:var(--ink)}
.mli.nl .mli-t{color:var(--ink);font-weight:700}.mli.nl{border-left:4px solid var(--brand)}
.mli-f{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}.mli-f svg{width:14px;height:14px}
.tagr{background:var(--late);color:#fff;font-weight:800;border-radius:6px;padding:2px 8px}.tago{background:var(--ok-t);color:var(--ok);font-weight:800;border-radius:6px;padding:2px 8px}
.tr{color:var(--late)}
.mt{background:var(--paper);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.mt-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mt-h h2{margin:0;font-size:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.mt-h h2 i{font-style:normal;color:var(--ink-3)}.mt-h p{margin:5px 0 0;font-size:13.5px;color:var(--ink-2)}
.mt-a{display:flex;gap:8px;align-items:center}.mt-a .mback{display:none}
.vh .btn.yoch{height:34px;padding:0 12px;font-size:13.5px;margin-left:6px;vertical-align:middle}
.vt{font-size:11px;font-weight:700;color:#5059C9;background:color-mix(in srgb,#5059C9 12%,transparent);border-radius:999px;padding:1px 8px}
.vh .btn.yoch.tm-on{color:#5059C9;border-color:color-mix(in srgb,#5059C9 45%,var(--line))}
.tgl{display:grid;gap:8px;margin-bottom:10px}
.tgr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr) 40px;gap:8px;align-items:center}
.tgr input,.tgr select{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px;min-width:0}
@media (max-width:640px){.tgr{grid-template-columns:minmax(0,1fr) 40px}.tgr input[data-te],.tgr select{grid-column:1}}
.btn.mdel{gap:6px;color:var(--ink-3)}.btn.mdel svg{width:17px;height:17px}
.btn.mdel.armado{background:#C0392B;border-color:#C0392B;color:#fff}
.bdel{margin-left:auto;border:0;background:none;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px;padding:2px 4px;border-radius:6px;cursor:pointer;font:inherit;font-size:12px}
.bdel svg{width:15px;height:15px}.bdel.armado{background:#C0392B;color:#fff;padding:2px 8px}
@media (max-width:860px){.btn.mdel:not(.armado) span{display:none}.btn.mdel:not(.armado){width:44px;padding:0;justify-content:center}}
.mt-l{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--paper-2)}
.mt-empty{justify-content:center}
.bub{max-width:min(78%,620px);align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--gc);border-radius:14px;padding:10px 13px}
.bub.mio{align-self:flex-end;border-left-width:1px;border-right:4px solid var(--gc);background:color-mix(in srgb,var(--brand) 9%,var(--paper))}
.bh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.bh b{font-size:14px}.bh span{font-size:12px;color:var(--ink-3)}
.bt{margin-top:4px;font-size:15.5px;line-height:1.45;white-space:normal;overflow-wrap:anywhere}
.ba{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.adj{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--paper-2);text-align:left;max-width:100%}
.adj svg{width:18px;height:18px;flex:none}.adj b{display:block;font-size:13px;overflow-wrap:anywhere}.adj small{color:var(--ink-3);font-size:11.5px}
.adj.img{padding:0;overflow:hidden;width:180px;height:130px;background:var(--line)}.adj.img img{width:100%;height:100%;object-fit:cover;display:block}
.mc{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.mc-p{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.mc-p>span{font-weight:800;font-size:13px;color:var(--ink-3);margin-right:4px}
.gsel{height:38px;padding:0 13px;border-radius:19px;border:2px solid var(--gc);color:var(--gc);font-weight:800;font-size:13.5px;background:transparent}
.gsel[aria-pressed=true]{background:var(--gc);color:#fff}
.mc-ref{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2)}.mc-ref .x{width:28px;height:28px}
.mc-f{display:flex;flex-wrap:wrap;gap:6px}.fch{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 8px}.fch svg{width:14px;height:14px}.fch button{width:24px;height:24px;display:grid;place-items:center}
.mc-r{display:flex;gap:8px;align-items:flex-end}
.mc-r textarea{flex:1;min-height:48px;max-height:180px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;background:var(--paper-2);color:var(--ink)}
.mc-r textarea:focus{outline:2px solid var(--brand);background:var(--paper)}
.mclip{width:48px;height:48px;cursor:pointer}.mclip svg{width:22px;height:22px}
.msend{height:48px;gap:8px;padding:0 18px}.msend svg{width:19px;height:19px}
.mc-q{display:flex;align-items:center;gap:8px;font-size:13.5px}.mc-q input{width:20px;height:20px}.mc-q span{color:var(--ink-3)}
.box.yo{max-width:620px}.yo-in{padding:18px;display:flex;flex-direction:column;gap:14px}.yo-in label{display:flex;flex-direction:column;gap:6px;font-weight:750}
.yo-in input{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:16px;background:var(--paper-2);color:var(--ink)}
.yo-g{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.yo-g>span{font-weight:750;width:100%}
@media (max-width:860px){.msgw{grid-template-columns:1fr;height:auto;min-height:0}.msgw.abierto .ml{display:none}.msgw:not(.abierto) .mt{display:none}.mt{height:calc(100dvh - var(--toph,64px) - 270px);min-height:400px}.mt-a .mback{display:grid}.mc-r .msend span{display:none}.msend{padding:0;width:48px;justify-content:center}}
body.v-art .tools .ib.qb{display:none!important}
.ib{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}
.fresh{font-size:12.5px;color:#A9C2D4;text-align:right;line-height:1.25;white-space:nowrap}
.fresh b{color:#fff;font-weight:650}
.fresh.old b{color:#FFC46B}
.sync{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:15px;background:rgba(255,255,255,.08);color:#C9DAE6;font-size:12.5px;font-weight:700;white-space:nowrap}
.sync[hidden]{display:none}
.sync i{width:9px;height:9px;border-radius:50%;background:#8496A3}
.sync.on i{background:#4DD08A;box-shadow:0 0 0 3px rgba(77,208,138,.25)}
.sync.busy i{background:#F5B544;animation:sp 1s ease-in-out infinite}
.sync.err i{background:#FF6B5E}
@keyframes sp{50%{opacity:.35}}
.tv-h .sync{height:4vh;font-size:1.7vh;border-radius:2vh}
/* empresa y sección */
.ctx{display:flex;gap:8px;align-items:center}
.sw{display:flex;background:rgba(255,255,255,.07);padding:4px;border-radius:12px;gap:2px}
.sw button{height:38px;padding:0 13px;border-radius:9px;font-weight:700;color:#C9DAE6;font-size:14px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.sw button[aria-pressed=true]{background:#fff;color:var(--navy)}
.sw .c{min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--late);color:#fff;font-size:11.5px;display:grid;place-items:center}
.sw.emp button{letter-spacing:.04em;font-variation-settings:"wdth" 110}
.sw i.dot{width:10px;height:10px;border-radius:3px;background:currentColor;opacity:.8}
@media (max-width:1180px){.fresh{display:none}.srch{width:210px}}
@media (max-width:640px){.top #ctx{order:4;flex:1 1 100%}.top #ctx .sw{flex:1}.top #ctx .sw button{flex:1;justify-content:center}.top .ctx.sec{padding-top:2px}}
@media (max-width:920px){.top .ctx.sec{margin-left:0;flex:1 1 100%}.top .ctx.sec .sw{flex:1}.top .ctx.sec .sw button{flex:1;justify-content:center}}
@media (max-width:640px){.ctx{flex-wrap:wrap}.ctx .sw{flex:1 1 100%}.sw button{padding:0 6px}}
@media (max-width:600px){#btnPrint{display:none}.toast{width:calc(100% - 24px);justify-content:space-between}.brand b{font-size:17px}}
.etag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:1px 5px;border-radius:4px;background:var(--paper-2);color:var(--ink-2);margin-right:4px;vertical-align:1px}
.etag.talgo{background:#E9E1F5;color:#5A3A8A}
:root[data-theme=dark] .etag.talgo{background:#2D2340;color:#C9B4EA}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .etag.talgo{background:#2D2340;color:#C9B4EA}}
.ttag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:1px 5px;border-radius:4px;background:color-mix(in srgb,var(--m4) 18%,transparent);color:var(--m4);margin-left:4px;vertical-align:1px}
.ttag.sub{background:color-mix(in srgb,var(--m5) 18%,transparent);color:var(--m5)}
.etag.libre{background:color-mix(in srgb,var(--m6) 16%,transparent);color:var(--m6);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:-2px}
.tc.libre{--tab:var(--m6)}
.cell .add,.lane-b .add{align-self:flex-start;height:30px;padding:0 10px;border-radius:8px;border:1px dashed color-mix(in srgb,var(--mc) 55%,var(--line));color:var(--ink-3);font-size:12.5px;font-weight:650;background:transparent;opacity:.75}
.cell .add:hover,.lane-b .add:hover{opacity:1;color:var(--ink);background:var(--paper)}
@media (hover:hover){.cell .add{opacity:0}.cell:hover .add{opacity:.85}}
@media (hover:none){.cell .add{width:30px;height:30px;padding:0;border-radius:50%;font-size:0;opacity:.45;margin-top:auto;align-self:flex-end;display:grid;place-items:center}.cell .add::before{content:"+";font-size:18px;line-height:1}.cell .tot{margin-top:0}}
.sug{display:inline-flex;align-items:center;gap:5px;margin-top:6px;height:28px;padding:0 9px;border-radius:7px;border:1px dashed var(--m4);color:var(--m4);font-size:12px;font-weight:750;background:color-mix(in srgb,var(--m4) 7%,transparent)}
.sug.sub{border-color:var(--m5);color:var(--m5);background:color-mix(in srgb,var(--m5) 7%,transparent)}
.rg{display:grid;grid-template-columns:minmax(0,1fr) 150px 44px;gap:8px;align-items:center;margin-bottom:8px}
.rg input,.rg select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0 10px;font-size:15px;width:100%;min-width:0}
.inst{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.inst b{display:block;font-size:15px}.inst span{font-size:13px;color:var(--ink-2)}
.inst .sp{flex:1}.inst .x2{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)}
.steps{margin:6px 0 0;padding-left:20px;line-height:1.7;font-size:14.5px}.steps b{font-weight:750}
:root{--caf:#0A5FA8;--caf-2:#03345E;--talgo:#6A3FB0;--talgo-2:#2E1657}
/* empresa activa: una franja de su color bajo la barra y el botón del selector en su color */
:root[data-emp=caf] .top{box-shadow:inset 0 -4px 0 var(--caf)}
:root[data-emp=talgo] .top{box-shadow:inset 0 -4px 0 var(--talgo)}
.sw.emp{padding:5px;gap:4px}
.secw button{position:relative;overflow:visible}

/* ---------- impresión ---------- */
#print{display:none}
[data-artifact] .noart{display:none!important}
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{background:#fff}
  .top,.dock,main,.toast,.scrim,.sheet{display:none!important}
  #print{display:block;color:#000;font-family:Archivo,Arial,sans-serif}
  .pr-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:5px;margin-bottom:6px}
  .pr-h b{font-size:18px}.pr-h span{font-size:10px}
  .pr-t{width:100%;border-collapse:collapse;table-layout:fixed}
  .pr-t th,.pr-t td{border:1px solid #777;vertical-align:top;padding:4px;font-size:9.5px}
  .pr-t th{background:#eee;text-align:left;font-size:10.5px}
  .pr-t td{height:31mm}
  .pr-t td.m{font-weight:800;font-size:11px;width:70px;word-break:break-word;hyphens:auto}
  .pr-c{border:1px solid #999;border-left:4px solid #000;padding:3px 4px;margin-bottom:3px;page-break-inside:avoid}
  .pr-c.late{border-left-color:#C8322B}.pr-c.soon{border-left-color:#D58B12}
  .pr-c b{display:block;font-size:9.5px}
  .pr-c .pq{font-weight:800;font-size:11px}
  .pr-c .ck{float:right;width:10px;height:10px;border:1px solid #000;margin-left:4px}
  .pr-f{margin-top:6px;font-size:9px;color:#333;display:flex;justify-content:space-between}
  .pr-day{page-break-after:always}
  .pr-day:last-child{page-break-after:auto}
  .pr-list{width:100%;border-collapse:collapse}
  .pr-list td,.pr-list th{border-bottom:1px solid #999;padding:6px 4px;font-size:11px;text-align:left}
  .pr-list th{border-bottom:2px solid #000}
  .pr-sem{color:#000}.pr-sem .vh h1{font-size:22px}.pr-sem .vh p{font-size:11px}.pr-sem .sn,.pr-sem .box{border-color:#999;break-inside:avoid}.pr-sem .sn b{font-size:24px}
  .pr-sem .mb .tr{border:1px solid #999;background:#fff}.pr-sem .mb .tr i{background:#000}.pr-sem .yr i{background:#000}
}

<script>
(function(){
'use strict';
/* =====================================================================
   TALLER · Bronymec — pedidos de CAF y Talgo y planificación de máquinas (fresa y torno).
   Solo lectura sobre los pedidos (vienen del panel de Jon, sin precios ni
   contratos). Lo único que se escribe es el PLAN del taller: qué artículo
   o pedido va a qué máquina y qué día, si está hecho y las notas.
   ===================================================================== */
const RAW = window.__TALLER_DATA__ || {ts:new Date().toISOString(), emp:{caf:{nombre:'CAF', lineas:[]}}};
/* v2: una o varias empresas (CAF, Talgo). Compatibilidad con el formato de una sola (CAF). */
const EMPS = RAW.emp || {caf: Object.assign({nombre:'CAF'}, RAW)};
const EIDS = Object.keys(EMPS);
let DATA = null;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const _nf = new Intl.NumberFormat('es-ES');
const nf = n => { const s = _nf.format(Math.round(n || 0)); return s.replace(/^(-?\d)(\d{3})$/, '$1.$2'); };
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DC = ['D','L','M','X','J','V','S'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
const dS = d => d.getDate()+' '+MESES[d.getMonth()];
const lunes = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
let HOY = new Date(); HOY.setHours(0,0,0,0);
const semanaN = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dn = (t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-dn+3); const f = new Date(Date.UTC(t.getUTCFullYear(),0,4)); return 1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7); };
const diasA = d => Math.round((d - HOY)/864e5);
/* Día de trabajo que cuenta para un plan: el sábado guarda el fin de semana entero. */
/* Día de trabajo "de hoy": en sábado y domingo la app trabaja ya sobre el lunes. */
const diaTrabajo = d => { let x = new Date(d); x.setHours(0,0,0,0); while (x.getDay() === 0 || x.getDay() === 6) x = addD(x, 1); return x; };
const slotDia = d => { const x = new Date(d); const w = x.getDay(); if (w === 0) x.setDate(x.getDate()-1); return iso(x); };

/* ---------- almacenamiento del plan (en esta tablet; con copia de seguridad) ---------- */
const KEY = 'taller.plan.v1';
const LS = { get(k){ try { return localStorage.getItem(k); } catch(_){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); return true; } catch(_){ return false; } } };
const MAQ0 = [{id:'h1', n:'Holzer 1', c:'m1', t:'fresa'}, {id:'h2', n:'Holzer 2', c:'m2', t:'fresa'}, {id:'cmi', n:'CMI', c:'m3', t:'fresa'}, {id:'tor', n:'Tornos', c:'m4', t:'torno'}, {id:'sec', n:'Seccionadora', c:'m6', t:'secc'}, {id:'sub', n:'Subcontratación', c:'m5', t:'sub'}];
let PLAN = (() => { try { const p = JSON.parse(LS.get(KEY) || 'null'); if (p && p.v === 1) return p; } catch(_){} return {v:1, maq:MAQ0.map(m => Object.assign({}, m)), items:{}, notas:{}, tema:null, upd:null}; })();
/* Seguridad: todo lo que entra en el plan (de otra tablet vía GitHub, de una copia cargada o de esta misma tablet)
   se limpia aquí: ids, máquinas, fechas, cantidades y secciones con formato cerrado; textos como texto y con tope. */
const MCOL_OK = /^m[1-6]$/, ID_OK = /^[a-z0-9]{1,24}$/, DIA_OK = /^\d{4}-\d{2}-\d{2}$/, SEC_OK = {fresa: 1, torno: 1, secc: 1, sub: 1};
const num = (v, a, b, def) => { const x = +v; return v !== '' && v != null && isFinite(x) && x >= a && x <= b ? x : def; };
const txt = (v, n) => typeof v === 'string' ? v.slice(0, n || 200) : (v == null ? '' : String(v).slice(0, n || 200));
const GR = {fresa: 'Fresadorak', torno: 'Tornoak', prod: 'Gaizka', com: 'Comercial', alm: 'Almacén', dir: 'Jon', ger: 'Ander'};
/* Dirección = Jon y Ander (gerente): los dos pueden borrar conversaciones y conectar con Teams. */
const esDir = g => g === 'dir' || g === 'ger';
const HOOK_OK = /^https:\/\/[a-z0-9.-]+\.(logic\.azure\.com|powerplatform\.com|webhook\.office\.com)(:443)?\//i;
const MAIL_OK = /^[^\s@<>"']{1,64}@[a-z0-9.-]{1,100}\.[a-z]{2,}$/i;
const GRC = {fresa: '#2E8BD8', torno: '#9C6EDD', prod: '#1A8A7D', com: '#C77A12', alm: '#B4553A', dir: '#4F6F96', ger: '#2F5D50'};
function sanear(){
  const P = PLAN;
  let maq = Array.isArray(P.maq) ? P.maq.filter(m => m && typeof m === 'object' && /^[a-z0-9]{1,12}$/.test(m.id || '')) : [];
  maq = maq.map(m => ({id: m.id, n: txt(m.n, 40) || m.id, c: MCOL_OK.test(m.c || '') ? m.c : 'm1', t: SEC_OK[m.t] ? m.t : 'fresa', cap: num(m.cap, 0, 24, 8), sab: num(m.sab, 0, 24, 0)}));
  const vistos = new Set(); P.maq = maq.filter(m => !vistos.has(m.id) && vistos.add(m.id));
  const ids = new Set(P.maq.map(m => m.id)), items = {};
  Object.entries(P.items && typeof P.items === 'object' ? P.items : {}).forEach(([k, it]) => {
    if (!it || typeof it !== 'object' || !ID_OK.test(k) || it.id !== k || !DIA_OK.test(it.d || '') || !['art','lin','libre'].includes(it.k)) return;
    const q = Math.round(+it.qty); if (!(q >= 1 && q <= 1e7)) return;
    const o = {id: k, k: it.k, m: ids.has(it.m) ? it.m : (P.maq[0] || {}).id, d: it.d, qty: q, done: !!it.done, ord: +it.ord || 0, nota: txt(it.nota, 300),
      key: it.k === 'libre' ? k : txt(it.key, 80), akey: it.k === 'libre' ? 'libre:' + k : txt(it.akey, 80), emp: it.k === 'libre' ? null : (EIDS.includes(it.emp) ? it.emp : 'caf'), ts: txt(it.ts, 30)};
    if (it.doneTs) o.doneTs = txt(it.doneTs, 30);
    if (it.h != null){ const hh = +it.h; if (hh > 0 && hh <= 500) o.h = Math.round(hh * 4) / 4; }
    if (it.k === 'libre'){ o.desc = txt(it.desc, 160) || 'Trabajo'; o.cli = txt(it.cli, 60); o.ref = txt(it.ref, 60); o.ent = DIA_OK.test(it.ent || '') ? it.ent : null; }
    items[k] = o; });
  P.items = items;
  const mapa = (m, f) => { const o = {}; Object.entries(m && typeof m === 'object' ? m : {}).forEach(([k, v]) => { const x = f(v); if (x != null && k.length < 120) o[k] = x; }); return o; };
  P.term = mapa(P.term, v => v && typeof v === 'object' ? {ts: txt(v.ts, 30)} : null);
  P.tipo = mapa(P.tipo, v => SEC_OK[v] ? v : null);
  P.notas = mapa(P.notas, v => typeof v === 'string' ? v.slice(0, 2000) : null);
  P.hp = mapa(P.hp, v => { const x = +v; return x > 0 && x <= 500 ? Math.round(x * 4) / 4 : null; });
  P.conf = {hdef: num(P.conf && P.conf.hdef, 0.25, 24, 2), rv: num(P.conf && P.conf.rv, 0, 99, 0)};
  P.clis = Array.isArray(P.clis) ? P.clis.filter(c => typeof c === 'string').map(c => c.slice(0, 60)).slice(0, 30) : [];
  P.reglas = Array.isArray(P.reglas) ? P.reglas.filter(g => g && typeof g === 'object').map(g => ({w: txt(g.w, 40).toUpperCase(), t: SEC_OK[g.t] ? g.t : 'torno'})).slice(0, 60) : undefined;
  if (P.tema != null && !['light','dark'].includes(P.tema)) P.tema = null;
  /* v18 · mensajes: solo campos conocidos, textos cortados; se guardan los 600 más recientes. */
  const MID = /^[a-z0-9]{6,32}$/, msg = {};
  Object.entries(P.msg && typeof P.msg === 'object' ? P.msg : {}).forEach(([k, m]) => {
    if (!m || typeof m !== 'object' || !MID.test(k) || m.id !== k || !GR[m.deg] || !GR[m.para]) return;
    const o = {id: k, de: txt(m.de, 40) || 'Alguien', deg: m.deg, para: m.para, txt: txt(m.txt, 2000), ts: txt(m.ts, 30), resp: !!m.resp, hilo: MID.test(m.hilo || '') ? m.hilo : null};
    if (m.ref && typeof m.ref === 'object' && EIDS.includes(m.ref.emp)) o.ref = {emp: m.ref.emp, key: txt(m.ref.key, 80), desc: txt(m.ref.desc, 120)};
    if (Array.isArray(m.adj)) o.adj = m.adj.filter(a => a && MID.test(a.id || '')).slice(0, 6).map(a => ({id: a.id, n: txt(a.n, 80) || 'fichero', t: txt(a.t, 60), s: num(a.s, 0, 2e7, 0)}));
    if (m.via === 'teams') o.via = 'teams'; if (m.tm) o.tm = 1;
    if (o.txt || (o.adj && o.adj.length)) msg[k] = o; });
  const ord = Object.values(msg).sort((a, b) => a.ts < b.ts ? 1 : -1).slice(0, 600); P.msg = {}; ord.forEach(m => { P.msg[m.id] = m; });
  P.mst = mapa(P.mst, v => v && typeof v === 'object' && v.c ? {c: txt(v.c, 30), por: txt(v.por, 40)} : null);
  /* v20 · Teams: dirección del flujo, agenda y clave privada para leer las respuestas. */
  const T0 = P.teams && typeof P.teams === 'object' ? P.teams : {};
  const hook = typeof T0.hook === 'string' && T0.hook.length < 2000 && HOOK_OK.test(T0.hook) ? T0.hook : '';
  const gente = (Array.isArray(T0.gente) ? T0.gente : []).filter(p => p && typeof p === 'object').map(p => ({n: txt(p.n, 40), e: MAIL_OK.test(p.e || '') ? String(p.e).toLowerCase().slice(0, 170) : '', g: GR[p.g] ? p.g : 'prod'})).filter(p => p.n || p.e).slice(0, 60);
  let pk = null; if (T0.pk && typeof T0.pk === 'object' && T0.pk.kty === 'RSA' && typeof T0.pk.n === 'string' && typeof T0.pk.d === 'string'){ pk = {}; ['kty','n','e','d','p','q','dp','dq','qi'].forEach(f => { if (typeof T0.pk[f] === 'string') pk[f] = T0.pk[f].slice(0, 2000); }); }
  P.teams = {on: !!T0.on && !!hook, hook, gente, pk, pub: !!T0.pub && !!pk};
}
function normalizarPlan(){
  sanear();
  if (!PLAN.maq || !PLAN.maq.length) PLAN.maq = MAQ0.map(m => Object.assign({}, m));
  PLAN.maq.forEach(m => { if (!m.t) m.t = m.id === 'tor' ? 'torno' : 'fresa'; });
  if (!PLAN.maq.some(m => m.t === 'torno')) PLAN.maq.push({id:'tor', n:'Tornos', c:'m4', t:'torno'});
  if (!PLAN.maq.some(m => m.t === 'secc')){ const i = PLAN.maq.findIndex(m => m.t === 'sub'); const sm = {id: PLAN.maq.some(m => m.id === 'sec') ? 'secc1' : 'sec', n:'Seccionadora', c:'m6', t:'secc'}; if (i < 0) PLAN.maq.push(sm); else PLAN.maq.splice(i, 0, sm); }
  if (!PLAN.maq.some(m => m.t === 'sub')) PLAN.maq.push({id:'sub', n:'Subcontratación', c:'m5', t:'sub'});
  PLAN.clis = PLAN.clis || [];
  /* Reglas de sección por palabra de la descripción (las pone el taller o Jon). "fresa" = no sugerir nunca otra sección. */
  if (!Array.isArray(PLAN.reglas)) PLAN.reglas = [{w: 'PLACA', t: 'fresa'}, {w: 'FTH', t: 'fresa'}];
  if ((PLAN.conf.rv || 0) < 2){ if (!PLAN.reglas.some(g => g.w === 'CASQUILLO')) PLAN.reglas.push({w: 'CASQUILLO', t: 'torno'}); PLAN.conf.rv = 2; }
  PLAN.items = PLAN.items || {}; PLAN.notas = PLAN.notas || {}; PLAN.term = PLAN.term || {}; PLAN.tipo = PLAN.tipo || {}; PLAN.msg = PLAN.msg || {}; PLAN.mst = PLAN.mst || {};
  Object.values(PLAN.items).forEach(it => { if (!it.emp && it.k !== 'libre') it.emp = 'caf'; });
}
normalizarPlan();
let historial = [];
function guardar(desc){
  PLAN.upd = new Date().toISOString();
  const ok = LS.set(KEY, JSON.stringify(PLAN));
  if (!ok) toast('No se ha podido guardar en esta tablet. Revisa que el navegador no esté en modo incógnito.');
  SYNC.local();
}
/* ================= PLAN COMPARTIDO =================
   El plan (fichas, terminados, secciones, notas, máquinas) se guarda también en un repositorio PRIVADO de GitHub,
   cifrado con la misma clave que abre la app (AES-GCM). Cada dispositivo lo lee cada pocos segundos y escribe al cambiar.
   Si dos dispositivos cambian a la vez, se mezcla ficha a ficha: gana el cambio más reciente de cada ficha. */
const SYNC = (() => {
  const CFG_K = 'taller.sync.cfg', MT_K = 'taller.sync.mt', NO_K = 'taller.sync.no';
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = u => { let s = ''; const a = new Uint8Array(u); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64u = s => s.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''), unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return s; };
  let ultErr = '', cfg = null, key = null, sha = null, etag = null, st = 'off', msg = 'Plan sin conectar', ultimo = null, tPush = null, tPull = null, ocupado = false, pend = false, ultOk = 0, fallos = 0;
  let MT = (() => { try { return JSON.parse(LS.get(MT_K) || '{}'); } catch(_){ return {}; } })();
  try { cfg = JSON.parse(LS.get(CFG_K) || 'null'); if (cfg){ cfg.repo = 'Baletxe/taller-plan'; if (typeof cfg.token !== 'string') cfg = null; } } catch(_){}
  async function clave(){
    if (key) return key;
    let raw = null; try { raw = localStorage.getItem('tl.k') || sessionStorage.getItem('tl.ks'); } catch(_){}
    if (!raw || !crypto.subtle) return null;
    const base = await crypto.subtle.importKey('raw', u8(raw), 'HKDF', false, ['deriveKey']);
    key = await crypto.subtle.deriveKey({name: 'HKDF', hash: 'SHA-256', salt: enc.encode('bronymec-taller'), info: enc.encode('plan-compartido-v1')}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);

  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !S.sheet){ e.preventDefault(); const b = $('btnQ'); if (getComputedStyle(b).display !== 'none' && !document.querySelector('.top.qopen')) b.click(); else $('q').focus(); }
});
let qt; $('q').addEventListener('input', e => { S.q = e.target.value; clearTimeout(qt); qt = setTimeout(() => { if (S.v === 'hoy' || S.v === 'elegir'){ S.v = 'articulos'; S.af = 'todo'; } render(); }, 160); });
document.addEventListener('change', e => {
  if (e.target.id === 'imp' && e.target.files[0]){ e.target.files[0].text().then(t => { try { const p = JSON.parse(t); if (p.v !== 1 || !p.items) throw 0; cambio('Copia cargada: ' + Object.keys(p.items).length + ' fichas', () => { PLAN.items = p.items; PLAN.notas = p.notas || {}; PLAN.term = p.term || {}; PLAN.tipo = p.tipo || {}; if (p.maq) PLAN.maq = p.maq; normalizarPlan(); }); S.sheet = null; pintarFicha(); } catch(_){ toast('Ese fichero no es una copia del plan del taller'); } }); }
  if (e.target.dataset && (e.target.dataset.rgW != null || e.target.dataset.rgT != null)){ const i = +(e.target.dataset.rgW != null ? e.target.dataset.rgW : e.target.dataset.rgT); const g = PLAN.reglas[i]; if (!g) return;
    if (e.target.dataset.rgW != null) g.w = e.target.value.trim().toUpperCase(); else g.t = e.target.value; guardar(); S.keepY = true; const sh = S.sheet; render(); S.sheet = sh; return; }
  if (e.target.dataset && (e.target.dataset.cap || e.target.dataset.sab || e.target.dataset.hdef)){ const v = +e.target.value; if (!(v >= 0 && v <= 24)) return;
    if (e.target.dataset.hdef) PLAN.conf.hdef = Math.max(0.25, v); else { const m = PLAN.maq.find(x => x.id === (e.target.dataset.cap || e.target.dataset.sab)); if (!m) return; if (e.target.dataset.cap) m.cap = v; else m.sab = v; }
    guardar(); S.keepY = true; render(); return; }
  if (e.target.dataset && e.target.dataset.maq){ const m = PLAN.maq.find(x => x.id === e.target.dataset.maq); if (m && e.target.value.trim()){ m.n = e.target.value.trim(); guardar(); render(); } }
});
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.nota != null){ const k = e.target.dataset.nota; const v = e.target.value; if (v.trim()) PLAN.notas[k] = v; else delete PLAN.notas[k]; clearTimeout(e.target._t); e.target._t = setTimeout(guardar, 500); } });

/* ---------- impresión ---------- */
function imprimir(que){
  const pr = $('print'); const ts = new Date(DATA.ts);
  const pie = `<div class="pr-f"><span>Bronymec · Taller · ${EIDS.map(e => esc(empN(e)) + ': pedidos del ' + (EMPS[e].export ? dS(pd(EMPS[e].export)) : '—')).join(' · ')}</span><span>Impreso el ${new Date().toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>`;
  const quien = inf => inf.libre ? (inf.cli || 'Otro') : EIDS.length > 1 ? empN(inf.emp) : '';
  const tarjeta = it => { const inf = infoItem(it); if (!inf) return ''; const u = inf.cod && inf.due && !inf.libre ? urg(inf.due, inf.late) : '';
    return `<div class="pr-c ${u}"><span class="ck"></span><b>${quien(inf) ? esc(quien(inf).toUpperCase()) + ' · ' : ''}${esc(inf.desc)}</b>${(() => { const c = it.k==='lin'?inf.l.pedido+' L'+inf.l.linea:(inf.cod||inf.ref); return c ? esc(c) + ' · ' : ''; })()}<span class="pq">${nf(it.qty)} uds</span>${inf.due ? ' · entrega ' + dS(inf.due) : ''}${it.nota?'<br>✎ '+esc(it.nota):''}</div>`; };
  if (que === 'resumen'){
    pr.innerHTML = `<div class="pr-h"><b>Bronymec · Taller</b><span>Impreso el ${new Date().toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div><div class="pr-sem">${vSemana().replace(/<div class="chips">[\s\S]*?<\/div><\/div>/, '</div>')}</div>${pie}`;
  } else if (que === 'semana'){
    const ds = diasSemana();
    pr.innerHTML = `<div class="pr-h"><b>Plan de máquinas${S.sec === 'todo' ? '' : ' · ' + SECN[S.sec]} · semana ${semanaN(ds[0])} (${dS(ds[0])} al ${dS(addD(ds[5],1))})</b><span>Marca la casilla al terminar cada ficha</span></div>
      <table class="pr-t"><thead><tr><th style="width:70px"></th>${ds.map((d,i) => `<th>${i===5?'Fin de semana':DIAS[d.getDay()][0].toUpperCase()+DIAS[d.getDay()].slice(1)+' '+dS(d)}</th>`).join('')}</tr></thead>
      <tbody>${maqVis().map(m => `<tr><td class="m">${esc(m.n)}</td>${ds.map(d => `<td>${itemsDe(m.id, iso(d)).map(tarjeta).join('')}</td>`).join('')}</tr>`).join('')}</tbody></table>${pie}`;
  } else {
    const k = slotDia(HOY);
    pr.innerHTML = maqVis().map(m => { const its = itemsDe(m.id, k); return `<div class="pr-day"><div class="pr-h"><b>${esc(m.n)} · ${DIAS[HOY.getDay()]} ${dS(HOY)}</b><span>${its.length} fichas</span></div>
      <table class="pr-list"><thead><tr><th style="width:24px">✓</th><th>Pieza</th><th>Código / pedido</th><th>Uds</th><th>Entrega</th><th>Nota</th></tr></thead><tbody>${its.map(it => { const inf = infoItem(it); if (!inf) return ''; return `<tr><td>☐</td><td><b>${esc(inf.desc)}</b></td><td>${quien(inf) ? esc(quien(inf)) + ' · ' : ''}${esc(it.k==='lin'?inf.l.pedido+' L'+inf.l.linea:(inf.cod||''))}</td><td><b>${nf(it.qty)}</b></td><td>${inf.due ? dS(inf.due) : '—'}</td><td>${esc(it.nota||'')}</td></tr>`; }).join('') || '<tr><td colspan="6">Sin trabajo planificado</td></tr>'}</tbody></table>${pie}</div>`; }).join('');
  }
  setTimeout(() => window.print(), 60);
}

/* Pantalla siempre encendida (Wake Lock): el sistema la suelta al cambiar de app; se vuelve a pedir al volver. */
let wl = null;
function despierta(){
  if (!('wakeLock' in navigator)) return;
  if (LS.get('taller.wake') === '1'){ if (!wl && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(x => { wl = x; x.addEventListener('release', () => { wl = null; }); }).catch(() => {}); }
  else if (wl){ wl.release().catch(() => {}); wl = null; }
}
document.addEventListener('visibilitychange', despierta);
despierta();

render(); if (S.v === 'tv') tvCiclo();
SYNC.iniciar();
if (location.protocol === 'file:') window.__TALLER_SYNC = SYNC;
setInterval(() => { const t = new Date(); t.setHours(0,0,0,0); if (+t !== +HOY && !S.drag && !S.sheet) render(); }, 60000);
if (location.protocol === 'file:') window.__TALLER = {S, PLAN, render, reconstruir, get ART(){ return ART; }, get LINEAS(){ return LINEAS; }, MOD, EMPS};
/* En la tablet (web): cada 2 minutos mira si hay datos nuevos y recarga cuando nadie está tocando la pantalla.
   El plan está guardado en la tablet, así que no se pierde nada al recargar. */
if (/^https?:/.test(location.protocol)){
  let toque = Date.now(), nueva = false;
  ['pointerdown','keydown','scroll'].forEach(ev => addEventListener(ev, () => { toque = Date.now(); }, {passive: true}));
  const recargar = () => { try { sessionStorage.setItem('taller.y', String(scrollY)); } catch(_){} location.reload(); };
  const mirar = () => {
    if (nueva){ decidir(); return; }
    fetch('version.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(v => {
      if (v && v.ts && v.ts !== RAW.ts){ nueva = true; decidir(); }
    }).catch(() => {});
  };
  /* Si nadie toca la pantalla, recarga sola; si alguien la está usando, un botón y él decide. */
  const decidir = () => {
    if (document.visibilityState !== 'visible') return;
    if (!S.drag && !S.sheet && Date.now() - toque > 60000) { recargar(); return; }
    if (!$('nd')){ const b = document.createElement('button'); b.id = 'nd'; b.className = 'newdata'; b.innerHTML = '<span>Hay datos nuevos de pedidos</span><b style="text-decoration:underline">Actualizar</b>'; b.onclick = recargar; document.body.appendChild(b); }
  };
  setInterval(mirar, 120000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') mirar(); });
  try { const y = +sessionStorage.getItem('taller.y'); sessionStorage.removeItem('taller.y'); if (y) setTimeout(() => scrollTo(0, y), 50); } catch(_){}
}
})();
</script>
